[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holix-office"
version = "0.1.0"
description = "MCP server that reads and edits DOCX, XLSX, PPTX, ODT, ODS, and ODP files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Pavel Lukyanov" }]
keywords = ["mcp", "office", "docx", "xlsx", "pptx", "odt", "holix"]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
    "pillow>=11.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "odfpy>=1.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
holix-office = "holix_office.__main__:main"

[project.urls]
Homepage = "https://github.com/javded-itres/holix-office"
Repository = "https://github.com/javded-itres/holix-office"
Documentation = "https://github.com/javded-itres/holix-office/blob/main/docs/en/reference.md"

[tool.hatch.build.targets.wheel]
packages = ["src/holix_office"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
